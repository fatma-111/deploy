<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BugHound">
  <defs>
    <linearGradient id="bh-grad" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2E86F0"/>
      <stop offset="0.55" stop-color="#1668E3"/>
      <stop offset="1" stop-color="#0B3C7E"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="36" height="36" rx="11" fill="url(#bh-grad)"/>
